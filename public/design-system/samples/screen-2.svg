<svg viewBox="0 0 590 980" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Neutral sample screen, shorter than a full phone">
  <style>
    .bg { fill: #eef0f1; }
    .block { fill: #dfe3e4; }
    .line { fill: #cfd5d6; }
    .accent { fill: #006e37; opacity: 0.35; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #161616; }
      .block { fill: #23262a; }
      .line { fill: #2f3438; }
      .accent { fill: #2aa566; opacity: 0.4; }
    }
  </style>
  <rect class="bg" width="590" height="980"/>
  <rect class="line" x="40" y="60" width="260" height="36" rx="8"/>
  <rect class="block" x="40" y="140" width="510" height="240" rx="16"/>
  <circle class="accent" cx="150" cy="520" r="70"/>
  <circle class="accent" cx="295" cy="520" r="70"/>
  <circle class="accent" cx="440" cy="520" r="70"/>
  <rect class="line" x="40" y="660" width="510" height="28" rx="8"/>
  <rect class="line" x="40" y="720" width="400" height="28" rx="8"/>
  <rect class="block" x="40" y="800" width="510" height="130" rx="16"/>
</svg>
