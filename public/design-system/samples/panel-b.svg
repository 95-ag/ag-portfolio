<svg viewBox="4 4 172 154" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Neutral sample panel B: two stacked layers with the second highlighted.">
  <title>Sample panel B</title>
  <defs>
    <style>
      .n  { fill: #f0f0f0; stroke: #9a9a9a; stroke-width: 1; }
      .na { fill: #f0f0f0; stroke: #98504a; stroke-width: 1.5; }
      .nt { fill: #f0f0f0; stroke: #9a9a9a; stroke-width: 1; }
      .zone { fill: #98504a; fill-opacity: 0.07; }
      .lbl { font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 500; fill: #1a1a1a; }
      .sub { font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 10px; fill: #666666; }
      .conn { fill: none; stroke: #666666; stroke-width: 1.5; }
      .af  { fill: #666666; }
      @media (prefers-color-scheme: dark) {
        .n  { fill: #1c1c1c; stroke: #6a6a6a; }
        .na { fill: #1c1c1c; stroke: #d58a88; }
        .nt { fill: #1c1c1c; stroke: #6a6a6a; }
        .zone { fill: #d58a88; }
        .lbl { fill: #e9e9e9; }
        .sub { fill: #b8b8b8; }
        .conn { stroke: #b8b8b8; }
        .af  { fill: #b8b8b8; }
      }
    </style>
    <marker id="arr" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto">
      <path class="af" d="M0,0 L7,3 L0,6 Z"/>
    </marker>
  </defs>

  <rect class="n" x="20" y="20" width="140" height="44" rx="4"/>
  <text class="lbl" x="90" y="47" text-anchor="middle">Layer 1</text>

  <line class="conn" x1="90" y1="64" x2="90" y2="98" marker-end="url(#arr)"/>

  <rect class="na" x="20" y="98" width="140" height="44" rx="4"/>
  <text class="lbl" x="90" y="125" text-anchor="middle">Layer 2</text>
</svg>
