<svg viewBox="24 16 388 292" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A quadrant map on two axes: grounded in the real source (vertical) and scales across projects (horizontal). Writing each page by hand is grounded but does not scale; handing a repo to a model scales but is not grounded; only this system sits in the top-right quadrant, both grounded and scaling.">
  <title>Grounded vs. scales — where each approach lands</title>
  <defs>
    <style>
      .n  { fill: #f3f4f5; stroke: #bbcabf; stroke-width: 1; }
      .na { fill: #f3f4f5; stroke: #006e37; stroke-width: 1.5; }
      .nt { fill: #f3f4f5; stroke: #bbcabf; stroke-width: 1; }
      .lbl { font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 500; fill: #2d2d2d; }
      .sub { font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 10px; fill: #6c7a71; }
      .conn { fill: none; stroke: #6c7a71; stroke-width: 1.5; }
      .af  { fill: #6c7a71; }
      @media (prefers-color-scheme: dark) {
        .n  { fill: #1c1b1b; stroke: #3c4a42; }
        .na { fill: #1c1b1b; stroke: #2aa566; }
        .nt { fill: #1c1b1b; stroke: #3c4a42; }
        .lbl { fill: #e2e2e2; }
        .sub { fill: #bbcabf; }
        .conn { stroke: #86948a; }
        .af  { fill: #86948a; }
      }
    </style>
    <marker id="arr" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto">
      <path class="af" d="M0,0 L7,3 L0,6 Z"/>
    </marker>
  </defs>

  <!-- good zone: grounded + scales (top-right), faint accent tint -->
  <rect x="230" y="40" width="150" height="110" fill="#006e37" fill-opacity="0.07"/>

  <!-- axes -->
  <line class="conn" x1="78" y1="150" x2="386" y2="150" marker-end="url(#arr)"/>
  <line class="conn" x1="230" y1="262" x2="230" y2="32" marker-end="url(#arr)"/>

  <!-- axis titles -->
  <text class="sub" transform="rotate(-90 54 150)" x="54" y="150" text-anchor="middle">Grounded in the real source →</text>
  <text class="sub" x="232" y="286" text-anchor="middle">Scales across projects →</text>

  <!-- Write by hand: grounded, doesn't scale (top-left) -->
  <circle class="n" cx="150" cy="92" r="6"/>
  <text class="lbl" x="150" y="74" text-anchor="middle">Write by hand</text>

  <!-- Hand a repo to a model: scales, not grounded (bottom-right) -->
  <circle class="n" cx="305" cy="205" r="6"/>
  <text class="lbl" x="305" y="226" text-anchor="middle">Hand a repo to a model</text>

  <!-- This system: grounded AND scales (top-right, accent) -->
  <circle class="na" cx="305" cy="92" r="7"/>
  <text class="lbl" x="305" y="74" text-anchor="middle">This system</text>
  <text class="sub" x="305" y="130" text-anchor="middle">grounded + scales</text>
</svg>
