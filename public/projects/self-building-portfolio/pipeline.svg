  <path class="na" fill="none" stroke-width="2" d="M 474 30 L 477.5 34 L 484 26"/>
  <text class="lbl" x="65" y="162" text-anchor="middle">Content</text>
  <text class="sub" x="65" y="176" text-anchor="middle">writes the deep-dive</text>
  <text class="lbl" x="190" y="162" text-anchor="middle">Assets</text>
  <text class="sub" x="190" y="176" text-anchor="middle">adds figures + tables</text>
  <text class="lbl" x="315" y="162" text-anchor="middle">Cover</text>
  <text class="sub" x="315" y="176" text-anchor="middle">adds the hero</text>
  <text class="lbl" x="440" y="162" text-anchor="middle">Review</text>
  <text class="sub" x="440" y="176" text-anchor="middle">two cold passes</text>
  <line class="conn" x1="110" y1="85" x2="145" y2="85" marker-end="url(#arr)"/>
  <text class="sub" x="127" y="77" text-anchor="middle">gate</text>
  <line class="conn" x1="235" y1="85" x2="270" y2="85" marker-end="url(#arr)"/>
  <text class="sub" x="252" y="77" text-anchor="middle">gate</text>
  <line class="conn" x1="360" y1="85" x2="395" y2="85" marker-end="url(#arr)"/>
  <text class="sub" x="377" y="77" text-anchor="middle">gate</text>
</svg>
